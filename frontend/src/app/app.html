<main class="cardapio">

  <header class="cabecalho">
    <div class="marca">
      <span class="logo">Logo</span>
      <span class="nome-restaurante">Nome do restaurante</span>
    </div>

    <button class="botao-pedido" type="button">
      Ver meu pedido
      <span class="contador">0</span>
    </button>
  </header>

  <section class="apresentacao">
    <h1>Cardápio</h1>
  </section>

  <nav class="navegacao-categorias" aria-label="Categorias do cardápio">
    <button type="button">Categoria 1</button>
    <button type="button">Categoria 2</button>
    <button type="button">Categoria 3</button>
  </nav>

  <div class="lista-categorias">

    <section class="secao-categoria">
      <div class="cabecalho-categoria">
        <h2>Nome da categoria</h2>
        <span class="linha-categoria"></span>
      </div>

      <div class="grade-produtos">
        <article class="card-produto">
          <div class="imagem-produto">Imagem</div>
          <div class="informacoes-produto">
            <h3>Nome do produto</h3>
            <p>Descrição do produto.</p>
            <strong>Preço</strong>
            <button class="botao-adicionar" type="button">Adicionar</button>
          </div>
        </article>

        <article class="card-produto">
          <div class="imagem-produto">Imagem</div>
          <div class="informacoes-produto">
            <h3>Nome do produto</h3>
            <p>Descrição do produto.</p>
            <strong>Preço</strong>
            <button class="botao-adicionar" type="button">Adicionar</button>
          </div>
        </article>
      </div>
    </section>

    <section class="secao-categoria">
      <div class="cabecalho-categoria">
        <h2>Outra categoria</h2>
        <span class="linha-categoria"></span>
      </div>

      <div class="grade-produtos">
        <article class="card-produto">
          <div class="imagem-produto">Imagem</div>
          <div class="informacoes-produto">
            <h3>Nome do produto</h3>
            <p>Descrição do produto.</p>
            <strong>Preço</strong>
            <button class="botao-adicionar" type="button">Adicionar</button>
          </div>
        </article>
      </div>
    </section>

  </div>

  <aside class="area-pedido">
    <h2>Meu pedido</h2>
    <p>Os produtos adicionados aparecerão aqui.</p>
  </aside>

</main>
