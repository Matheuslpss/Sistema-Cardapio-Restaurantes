<main class="cardapio">

  <header class="cabecalho">
    <div class="marca">
      <img 
       class = "logo"
       src= "imagens/logo.png"
       alt="Logo do restaurante" >
    </div>

    <button class="botao-pedido" type="button">
      Ver meu pedido
      <span class="contador">0</span>
    </button>
  </header>

  <section class="apresentacao">
    <h1>Cardápio</h1>
  </section>

  <nav class="navegacao-categorias" aria-label="Categorias do cardápio">
    <button
      class="botao-categoria"
      [class.categoria-selecionada]="selectedCategory === 'Categoria 1'"
      (click)="selectedCategory = 'Categoria 1'"
      type="button">
      Categoria 1
    </button>
    <button
      class="botao-categoria"
      [class.categoria-selecionada]="selectedCategory === 'Categoria 2'"
      (click)="selectedCategory = 'Categoria 2'"
      type="button">
      Categoria 2
    </button>
    <button
      class="botao-categoria"
      [class.categoria-selecionada]="selectedCategory === 'Categoria 3'"
      (click)="selectedCategory = 'Categoria 3'"
      type="button">
      Categoria 3
    </button>
  </nav>

  <div class="lista-categorias">

    <section class="secao-categoria" [hidden]="selectedCategory !== 'Categoria 1'">
      <div class="titulo-categoria">
        <h2>Entradas</h2>
        <span class="linha-categoria"></span>
      </div>

      <div class="grade-produtos">
        <article class="card-produto">
          <div class="imagem-produto">Imagem</div>
          <div class="informacoes-produto">
            <h3>Nome do produto</h3>
            <p>Descrição do produto.</p>
            <div class="acoes-produto">
              <strong>Preço</strong>
              <button class="botao-adicionar" type="button">Adicionar</button>
            </div>
          </div>
        </article>

        <article class="card-produto">
          <div class="imagem-produto">Imagem</div>
          <div class="informacoes-produto">
            <h3>Nome do produto</h3>
            <p>Descrição do produto.</p>
            <div class="acoes-produto">
              <strong>Preço</strong>
              <button class="botao-adicionar" type="button">Adicionar</button>
            </div>
          </div>
        </article>
      </div>
    </section>

    <section class="secao-categoria" [hidden]="selectedCategory !== 'Categoria 2'">
      <div class="grade-produtos">
        <article class="card-produto">
          <div class="imagem-produto">Imagem</div>
          <div class="informacoes-produto">
            <h3>Nome do produto</h3>
            <p>Descrição do produto.</p>
            <div class="acoes-produto">
              <strong>Preço</strong>
              <button class="botao-adicionar" type="button">Adicionar</button>
            </div>
          </div>
        </article>
      </div>
    </section>

    <section class="secao-categoria" [hidden]="selectedCategory !== 'Categoria 3'">
      <p>Nenhum produto cadastrado nesta categoria.</p>
    </section>
  </div>

  <aside class="area-pedido">
    <h2>Meu pedido</h2>
    <p>Os produtos adicionados aparecerão aqui.</p>
  </aside>

</main>
